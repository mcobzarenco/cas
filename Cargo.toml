[workspace]
# The app is the package at the root; `cargo run` starts it. The automata themselves are in
# `cas-core`, which knows nothing of Bevy, and `cas-search` looks for interesting rules with it.
members = ["crates/cas-core", "crates/cas-search"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcobzarenco/cas"

[package]
name = "cas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A sandbox for exploring reversible block cellular automata"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  # core app + platform (`x11` runs under XWayland too; native Wayland is the crate's `wayland` feature)
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "x11",
  # rendering + UI
  "ui_bevy_render",
  "bevy_picking",
  "ui_picking",
  "scene",
  "default_font",
  "png",
  # the dark-themed widget set
  "bevy_feathers",
  # copy/paste of rule strings through the OS clipboard
  "bevy_clipboard",
  "system_clipboard",
] }
# With `bevy`, the universe and the random generator are Bevy resources.
cas-core = { path = "crates/cas-core", features = ["bevy"] }
clap = { version = "4", features = ["derive"] }

[features]
default = ["wayland"]
# Native Wayland windows; needs libwayland-dev at build time (`--no-default-features` to go without).
wayland = ["bevy/wayland"]
# Faster incremental builds while iterating: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

# Bevy's recommended dev profile: optimise dependencies once, keep our own crate quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
